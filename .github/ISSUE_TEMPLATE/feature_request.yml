name: Feature request
description: Describe a use case and the behavior that would help.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe how it fits the existing workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
