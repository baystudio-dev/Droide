name: Bug report
description: Report reproducible application behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include passwords, API keys, tokens or private project content.
  - type: input
    id: version
    attributes:
      label: Droide version and distribution
      description: Include the version shown in About & Legal and where the APK came from.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add the error text or a screenshot if useful; remove private information first.
    validations:
      required: true
