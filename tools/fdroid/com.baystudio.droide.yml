Builds:
  - versionName: '1.03.4'
    versionCode: 51
    commit: v1.03.4-fdroid
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - apt-get install -y make patch
    init: sed -i 's/android\.signingConfigs\.getByName/(android.signingConfigs).getByName/g'
      app/build.gradle.kts
    output: app/build-source-release-fdroid-candidate/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - reproducible-apk-tools@ca728486d42a79f1c9ec0c6ec755c39f251911a8
    prebuild: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1'
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - python3 -B tools/build_fdroid_candidate.py --sdk "$ANDROID_HOME" --java-home
        "$JAVA_HOME" --gradle "$(command -v gradle)" --dependencies "$PWD/.fdroid-source-products"
        --device-storage
    ndk: 28.2.13676358
    postbuild:
      - python3 "$$reproducible-apk-tools$$/zipalign.py" --page-size 16 --pad-like-apksigner
        --replace "$$OUT$$" "$$OUT$$.aligned"
      - mv "$$OUT$$.aligned" "$$OUT$$"

AllowedAPKSigningKeys: 0cc1c5885fea5c5779eb4b3ddcce2a8518b7c207cab7dd7606e94c4d27ccb7ac

MaintainerNotes: |-
  The planned upstream packaging tag for this candidate is v1.03.4-fdroid.
  Publish the tag and signed upstream APK before submitting the recipe. The init substitution is
  semantically equivalent Kotlin: it preserves default-debug-config reads in
  inactive task definitions when remove_signing_keys runs. The normal sanitizer
  still removes the release signing configuration and signing assignments.

  JDK 17 is required by the terminal source builder and is installed from Debian
  Bookworm on Trixie buildservers. The existing reproducible-apk-tools srclib
  normalizes Build Tools 36 ZIP alignment before upstream signature verification.

  Ubuntu and optional executable tool downloads require user consent. The recipe
  retains shared-file support, which also requires Android permission and opt-in.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+(\.[0-9]+)?-fdroid$
